openapi: 3.0.4
info:
  title: Service API
  description: Management of users, roles, and applications
  version: 0.1.9

# servers:
#   - url: http://api.example.com/v1
#     description: Optional server description, e.g. Main (production) server
#   - url: http://staging-api.example.com
#     description: Optional server description, e.g. Internal staging server for testing

paths:
  /users:
    get:
      summary: Returns a list of users.
      description: Admins can view all users in the system.
      responses:
        "200": # status code
          description: A JSON array of user names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

components:
  schemas:
    UserOverview:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        role_count:
          type: integer
          format: int32
        application_count:
          type: integer
          format: int32
        created_at:
          type: integer
          format: int32
        updated_at:
          type: integer
          format: int32  
        status:
          type: string
          enum:
            - active
            - inactive
        last_login:
          type: integer
          format: int32
        last_login_country:
          type: string  